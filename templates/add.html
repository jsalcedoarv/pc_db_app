<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Parts Inventory</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tempstyle.css') }}">
</head>
<body>
    <nav class="navbar">
        <ul>
            <!-- <li><a href="{{ url_for('add_part') }}">Add PC Part</a></li> -->
            <li><a href="{{ url_for('index') }}">Available Parts</a></li>
            <li><a href="{{ url_for('search_parts') }}">Search</a></li>
        </ul>
    </nav>

    <div class="hero-container">
        <h1>PC Parts Inventory</h1>
        <form action="{{ url_for('add_part') }}" method="POST" class="add-form">
            <input type="text" name="name" placeholder="Part Name" required>

            <!-- Dropdown for Part Type -->
            <select name="part_type" required>
                <option value="" disabled selected>Select Part Type</option>
                <option value="CPU">CPU</option>
                <option value="CPU Cooler">CPU Cooler</option>
                <option value="Motherboard">Motherboard</option>
                <option value="RAM">RAM</option>
                <option value="SSD">SSD</option>
                <option value="HDD">HDD</option>
                <option value="GPU">GPU</option>
                <option value="Case">Case</option>
                <option value="PSU">PSU</option>
            </select>

            <input type="text" name="serial_number" placeholder="Serial Number" required>
            <input type="number" step="0.01" name="price" placeholder="Price" required>

            <!-- Audit Date Input -->
            <input type="date" name="audit_date" required>

            <button type="submit" class="cta-button">Add Part</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Serial Number</th>
                    <th>Price</th>
                    <th>Audit Date</th>
                </tr>
            </thead>
            <tbody>
                {% for part in parts %}
                <tr>
                    <td>{{ part.name }}</td>
                    <td>{{ part.part_type }}</td>
                    <td>{{ part.serial_number }}</td>
                    <td>£{{ part.price }}</td>
                    <td>{{ part.audit_date }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
</body>
</html>
